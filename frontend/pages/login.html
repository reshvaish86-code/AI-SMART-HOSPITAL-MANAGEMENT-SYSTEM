<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI Smart Hospital Management System</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6.5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="text-info text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
          <i class="fa-solid fa-hospital-user fs-4"></i>
          <span class="fw-bold fs-5 text-white">AI Smart Hospital</span>
        </a>
        <h4 class="fw-bold mb-1 text-white">Sign In to Your Account</h4>
        <p class="text-light opacity-75 small mb-0">Select your role or sign in directly with credentials</p>
      </div>

      <div class="auth-body">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label text-dark fw-semibold small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
              <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label class="form-label text-dark fw-semibold small">Password</label>
              <a href="#" class="text-decoration-none small text-primary" onclick="alert('Please contact hospital admin to reset your credentials.');">Forgot?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
              <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" id="btnLoginSubmit" class="btn btn-primary-custom w-100 py-2 mt-2">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
          </button>
        </form>

        <!-- 1-Click Demo Accounts -->
        <div class="demo-credentials-box">
          <div class="fw-bold text-dark mb-2 d-flex align-items-center gap-1">
            <i class="fa-solid fa-bolt text-warning"></i> Instant Demo Logins (Click to Autofill):
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="demo-btn-pill" onclick="fillDemo('patient.manoj@gmail.com', 'Patient@123')">
              <i class="fa-solid fa-user text-success me-1"></i> Patient (Chennai)
            </button>
            <button type="button" class="demo-btn-pill" onclick="fillDemo('doctor.rajesh@hospital.com', 'Doctor@123')">
              <i class="fa-solid fa-user-doctor text-primary me-1"></i> Doctor (Cardiologist)
            </button>
            <button type="button" class="demo-btn-pill" onclick="fillDemo('admin@hospital.com', 'Admin@123')">
              <i class="fa-solid fa-shield-halved text-danger me-1"></i> Admin
            </button>
          </div>
        </div>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          Don't have an account yet? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register here</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function fillDemo(email, pass) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
      API.toast(`Demo credentials loaded for ${email}`, 'info');
    }

    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Authenticating...';

      await Auth.login(email, pass);

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i> Sign In';
    });
  </script>
</body>
</html>
